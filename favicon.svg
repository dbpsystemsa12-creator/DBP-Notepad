<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <filter id="shadow-large" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="shadow-fold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg-grad)" />
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#rim-grad)" stroke-width="2" />

  <rect x="112" y="96" width="288" height="320" rx="28" fill="url(#accent-grad)" filter="url(#shadow-large)" />

  <path d="M 112 124 A 28 28 0 0 1 140 96 H 372 A 28 28 0 0 1 400 124 V 304 L 288 416 H 140 A 28 28 0 0 1 112 388 Z" 
        fill="url(#paper-grad)" />
        
  <rect x="156" y="140" width="80" height="6" rx="3" fill="#E2E8F0" />
  <rect x="156" y="160" width="130" height="6" rx="3" fill="#E2E8F0" />

  <path d="M 196 320 V 210 L 316 320 V 210" 
        fill="none" 
        stroke="url(#accent-grad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <path d="M 400 304 L 288 416 L 288 320 A 16 16 0 0 1 304 304 Z" 
        fill="url(#fold-grad)" 
        filter="url(#shadow-fold)" />
        
</svg>
