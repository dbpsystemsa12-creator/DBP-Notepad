<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f29" />
      <stop offset="50%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#181922" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="spiralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#8892a0" />
      <stop offset="100%" stop-color="#2a303c" />
    </linearGradient>
  </defs>

  <rect x="110" y="60" width="320" height="392" rx="16" fill="none" stroke="#00ffff" stroke-width="12" opacity="0.4" filter="url(#ambientGlow)" />

  <rect x="110" y="60" width="320" height="392" rx="16" fill="url(#coverGrad)" stroke="#00ffff" stroke-width="2" />
  
  <rect x="110" y="60" width="40" height="392" rx="16" fill="url(#spineGrad)" />
  <line x1="150" y1="60" x2="150" y2="452" stroke="#000000" stroke-width="3" opacity="0.8" />

  <g stroke="#00ffff" stroke-width="2.5" fill="none" opacity="0.9" filter="url(#neonGlow)">
    <path d="M 430 120 L 390 120 L 370 140 L 370 160" />
    <circle cx="370" cy="160" r="4.5" fill="#00ffff" />
    <circle cx="430" cy="120" r="3.5" fill="#00ffff" />
    
    <path d="M 430 392 L 390 392 L 350 352 L 310 352" />
    <circle cx="310" cy="352" r="4.5" fill="#00ffff" />
    <circle cx="430" cy="392" r="3.5" fill="#00ffff" />
    
    <path d="M 170 392 L 210 392 L 230 372 L 230 352" />
    <circle cx="230" cy="352" r="4.5" fill="#00ffff" />
    <circle cx="170" cy="392" r="3.5" fill="#00ffff" />
  </g>

  <rect x="170" y="140" width="220" height="160" rx="8" fill="#000000" stroke="#00ffff" stroke-width="3" filter="url(#neonGlow)" />
  
  <g stroke="#00ffff" stroke-width="1" opacity="0.2">
    <line x1="172" y1="160" x2="388" y2="160" />
    <line x1="172" y1="180" x2="388" y2="180" />
    <line x1="172" y1="200" x2="388" y2="200" />
    <line x1="172" y1="220" x2="388" y2="220" />
    <line x1="172" y1="240" x2="388" y2="240" />
    <line x1="172" y1="260" x2="388" y2="260" />
    <line x1="172" y1="280" x2="388" y2="280" />
  </g>

  <text x="280" y="215" font-family="'Arial Black', 'Impact', sans-serif" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#neonGlow)">
    DBP
  </text>
  <text x="280" y="260" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#00ffff" text-anchor="middle" letter-spacing="3">
    NOTEPAD
  </text>

  <rect x="365" y="243" width="12" height="20" fill="#00ffff" filter="url(#neonGlow)" />

  <g fill="url(#spiralGrad)" stroke="#000000" stroke-width="3">
    <rect x="80" y="90" width="50" height="16" rx="8" />
    <circle cx="130" cy="98" r="4" fill="#000000" stroke="none" />
    <rect x="80" y="140" width="50" height="16" rx="8" />
    <circle cx="130" cy="148" r="4" fill="#000000" stroke="none" />
    <rect x="80" y="190" width="50" height="16" rx="8" />
    <circle cx="130" cy="198" r="4" fill="#000000" stroke="none" />
    <rect x="80" y="240" width="50" height="16" rx="8" />
    <circle cx="130" cy="248" r="4" fill="#000000" stroke="none" />
    <rect x="80" y="290" width="50" height="16" rx="8" />
    <circle cx="130" cy="298" r="4" fill="#000000" stroke="none" />
    <rect x="80" y="340" width="50" height="16" rx="8" />
    <circle cx="130" cy="348" r="4" fill="#000000" stroke="none" />
    <rect x="80" y="390" width="50" height="16" rx="8" />
    <circle cx="130" cy="398" r="4" fill="#000000" stroke="none" />
  </g>
</svg>
