<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DBP | Notepad</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        /* =========================================
           ROOT VARIABLES & MASTER RESET
           ========================================= */
        :root {
            --bg-master: linear-gradient(357deg, #000000, #1c1c1c);
            --panel-bg: rgba(15, 15, 18, 0.85);
            --toolbar-bg: rgba(10, 10, 12, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-main: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --font-mono: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --sidebar-width: 260px;
            --editor-font-size: 14px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background: var(--bg-master); 
            color: var(--text-primary); 
            font-family: var(--font-sans);
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
        }

        /* =========================================
           LOGIN OVERLAY
           ========================================= */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box {
            background: var(--panel-bg); padding: 40px; border-radius: 12px;
            border: 1px solid var(--accent-main); box-shadow: 0 0 30px var(--accent-glow);
            text-align: center; width: 90%; max-width: 400px;
        }
        .login-box h1 { margin-bottom: 20px; font-size: 1.5rem; letter-spacing: 2px; }
        .login-box h1 span { color: var(--accent-main); }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border-color);
            color: #fff; outline: none; text-align: center; font-family: var(--font-mono);
        }
        .login-input:focus { border-color: var(--accent-main); }
        .login-btn {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            background: var(--accent-main); color: #000; font-weight: bold; cursor: pointer;
            transition: 0.2s;
        }
        .login-btn:hover { box-shadow: 0 0 15px var(--accent-glow); }
        #login-error { color: var(--danger); margin-top: 15px; font-size: 0.9rem; display: none; }

        /* =========================================
           SIDEBAR & FILE EXPLORER
           ========================================= */
        #sidebar-container { 
            display: flex; height: 100%; z-index: 20; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        #sidebar-container.hidden { transform: translateX(-100%); position: absolute; }

        #sidebar { 
            width: var(--sidebar-width); min-width: 200px; max-width: 500px; 
            background: var(--panel-bg); border-right: 1px solid var(--border-color); 
            display: flex; flex-direction: column; backdrop-filter: blur(15px); 
        }
        
        .resizer { 
            width: 4px; background: transparent; cursor: col-resize; z-index: 100; transition: background 0.2s; 
        }
        .resizer:hover, .resizer.active { background: var(--accent-main); box-shadow: 0 0 10px var(--accent-glow); }

        .sidebar-header { padding: 20px 15px 15px; border-bottom: 1px solid var(--border-color); }
        .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .brand h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; color: #fff; }
        .brand span { color: var(--accent-main); }
        
        .search-box { 
            width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--border-color); border-radius: 6px; 
            color: var(--text-primary); font-size: 0.85rem; outline: none; transition: 0.2s; 
        }
        .search-box:focus { border-color: var(--accent-main); }

        .sidebar-actions { display: flex; gap: 5px; margin-top: 10px; }
        .sidebar-btn { 
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); 
            color: var(--text-secondary); padding: 5px; border-radius: 4px; cursor: pointer; 
            font-size: 0.8rem; transition: 0.2s; 
        }
        .sidebar-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .sidebar-btn.primary { color: var(--accent-main); border-color: rgba(0,210,255,0.3); }
        .sidebar-btn.primary:hover { background: var(--accent-main); color: #000; }

        #notes-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .note-card { 
            border-radius: 6px; padding: 8px 12px; margin-bottom: 4px; cursor: pointer; 
            display: flex; gap: 10px; align-items: center; transition: all 0.2s; border: 1px solid transparent; 
        }
        .note-card:hover { background: rgba(255,255,255,0.05); }
        .note-card.active { 
            background: rgba(0, 210, 255, 0.08); border-color: rgba(0, 210, 255, 0.4); 
            border-left: 3px solid var(--accent-main);
        }
        .note-icon { font-size: 1.3rem; }
        .note-info { overflow: hidden; flex-grow: 1; }
        .note-info h3 { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e2e8f0; }
        .note-info p { font-size: 0.65rem; color: var(--text-secondary); margin-top: 2px; }

        .ext-html { color: #2ed573; text-shadow: 0 0 8px rgba(46, 213, 115, 0.6); }
        .text-html { color: #2ed573 !important; font-weight: bold !important; text-shadow: 0 0 5px rgba(46, 213, 115, 0.3); }
        .ext-css { color: #3498db; } .ext-js { color: #f1c40f; } .ext-json { color: #00d2ff; } 
        .ext-md { color: #9b59b6; } .ext-ino { color: #00979D; } .ext-py { color: #e67e22; }

        /* =========================================
           MAIN WORKSPACE & TOOLBAR
           ========================================= */
        #workspace { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; background: rgba(0,0,0,0.4); }

        .tabs { display: flex; background: var(--toolbar-bg); border-bottom: 1px solid var(--border-color); padding-top: 5px; }
        .tab { 
            padding: 10px 20px; color: var(--text-secondary); cursor: pointer; border-radius: 6px 6px 0 0; 
            font-size: 0.85rem; user-select: none; margin-left: 5px; border-bottom: 2px solid transparent; 
        }
        .tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
        .tab.active { color: var(--accent-main); background: rgba(0, 210, 255, 0.05); border-bottom-color: var(--accent-main); }
        .toggle-sidebar { margin-left: auto; background: transparent; color: var(--text-secondary); border: none; cursor: pointer; padding: 0 15px; font-size: 1.2rem; }

        .toolbar { 
            padding: 8px 15px; background: rgba(15,15,18,0.8); border-bottom: 1px solid var(--border-color); 
            display: flex; align-items: center; gap: 6px; 
        }
        .filename-input { 
            background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: var(--accent-main); 
            padding: 6px 12px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.9rem; width: 200px; outline: none; font-weight: bold; 
        }
        .filename-input:focus { border-color: var(--accent-main); }
        .unsaved-dot { height: 8px; width: 8px; background: var(--danger); border-radius: 50%; margin-left: 8px; display: none; box-shadow: 0 0 8px var(--danger); }
        .divider { width: 1px; height: 18px; background: var(--border-color); margin: 0 5px; }
        
        .icon-btn { 
            background: transparent; color: var(--text-secondary); border: none; border-radius: 4px; 
            height: 32px; min-width: 32px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 1.1rem; transition: 0.2s; position: relative; 
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
        .icon-btn.danger:hover { background: rgba(255, 71, 87, 0.15); color: var(--danger); }
        .icon-btn.primary { color: var(--accent-main); }
        .icon-btn.primary:hover { background: rgba(0, 210, 255, 0.15); }
        .icon-btn.active { background: rgba(0, 210, 255, 0.2); color: var(--accent-main); }
        
        /* Tooltips hidden on touch/mobile logic handled via media query */
        .icon-btn::after { 
            content: attr(data-tooltip); position: absolute; bottom: -30px; left: 50%; 
            transform: translateX(-50%) scale(0.9); background: #000; color: #fff; font-size: 0.75rem; 
            padding: 4px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; 
            transition: 0.2s; z-index: 100; border: 1px solid var(--border-color); 
        }
        .icon-btn:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }

        /* =========================================
           SPLIT VIEW & EDITOR
           ========================================= */
        .workspace-core { flex-grow: 1; display: flex; overflow: hidden; flex-direction: column; }
        .split-container { flex-grow: 1; display: flex; overflow: hidden; }
        
        .editor-wrapper, .preview-wrapper { display: flex; flex-grow: 1; position: relative; width: 100%; }
        .preview-wrapper { display: none; background: #fff; }
        
        .split-mode .editor-wrapper { width: 50%; border-right: 1px solid var(--border-color); }
        .split-mode .preview-wrapper { width: 50%; display: flex; }

        .line-numbers { 
            width: 50px; min-width: 50px; background: rgba(0,0,0,0.3); border-right: 1px solid var(--border-color); 
            padding: 20px 0; text-align: right; color: #475569; font-family: var(--font-mono); 
            font-size: var(--editor-font-size); line-height: 1.6; user-select: none; overflow: hidden; 
        }
        .line-numbers span { display: block; padding-right: 12px; }
        .line-numbers span.active-line { color: #fff; background: rgba(255,255,255,0.05); border-right: 2px solid var(--accent-main); }

        #editor { 
            flex-grow: 1; padding: 20px; font-size: var(--editor-font-size); line-height: 1.6; 
            color: #e2e8f0; background: transparent; border: none; outline: none; resize: none; 
            overflow-y: auto; font-family: var(--font-mono); white-space: pre; tab-size: 4; 
        }
        #preview-frame { width: 100%; height: 100%; border: none; background: #fff; }
        #preview-text { display: none; width: 100%; height: 100%; padding: 30px; overflow-y: auto; background: #0b0f19; line-height: 1.6; color: #fff; font-size: var(--editor-font-size); }

        /* =========================================
           TERMINAL / CONSOLE
           ========================================= */
        #terminal-panel { height: 150px; border-top: 1px solid var(--border-color); background: #0a0a0c; display: none; flex-direction: column; }
        .terminal-header { padding: 4px 10px; background: rgba(255,255,255,0.05); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-secondary); }
        .terminal-output { flex-grow: 1; padding: 10px; overflow-y: auto; font-family: var(--font-mono); font-size: calc(var(--editor-font-size) - 2px); }
        .log-line { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 3px 0; }
        .log-error { color: var(--danger); background: rgba(255,71,87,0.1); }
        .log-warn { color: var(--warning); }
        .log-info { color: var(--accent-main); }
        .terminal-clear { cursor: pointer; color: var(--text-secondary); } 
        .terminal-clear:hover { color: #fff; }

        /* =========================================
           STATUS BAR
           ========================================= */
        .status-bar { background: var(--toolbar-bg); border-top: 1px solid var(--border-color); padding: 4px 15px; display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b; font-family: var(--font-mono); }
        .status-left span, .status-right span { margin-right: 15px; } 
        .status-right span { margin-left: 15px; margin-right: 0; }
        .dbp-tag { color: #000; font-weight: bold; background: var(--accent-main); padding: 1px 8px; border-radius: 4px; }

        /* =========================================
           MODALS, ALERTS & SCROLLBARS
           ========================================= */
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-track { background: transparent; } 
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .cmd-palette { display: none; position: fixed; top: 15%; left: 50%; transform: translateX(-50%); width: 500px; background: rgba(15,15,20,0.95); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); z-index: 200; flex-direction: column; }
        .cmd-input { width: 100%; padding: 15px; background: transparent; border: none; border-bottom: 1px solid var(--border-color); color: #fff; outline: none; font-family: var(--font-sans); }
        .cmd-results { max-height: 300px; overflow-y: auto; } 
        .cmd-item { padding: 10px 15px; color: var(--text-secondary); cursor: pointer; display: flex; justify-content: space-between; } 
        .cmd-item:hover { background: var(--accent-main); color: #000; }

        .dialog-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .dialog-box { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center; font-family: var(--font-sans); }
        .dialog-box h3 { margin-bottom: 10px; color: #fff; font-size: 1.2rem; }
        .dialog-box p { margin-bottom: 20px; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; }
        .dialog-actions { display: flex; justify-content: center; gap: 15px; }
        .dialog-btn { padding: 8px 20px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .cancel-btn { background: rgba(255,255,255,0.1); color: #fff; }
        .cancel-btn:hover { background: rgba(255,255,255,0.2); }
        .confirm-btn { background: var(--accent-main); color: #000; }
        .confirm-btn:hover { background: var(--accent-glow); color: #fff; }

        /* =========================================
           MOBILE OPTIMIZATIONS
           ========================================= */
        @media (max-width: 768px) {
            #sidebar-container { position: absolute; left: 0; top: 0; height: 100vh; transform: translateX(-100%); transition: 0.3s; }
            #sidebar-container:not(.hidden) { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
            #sidebar { width: 280px; max-width: 85vw; }
            .resizer { display: none; } /* Disable manual resize on mobile */
            
            .toolbar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px; }
            .filename-input { width: 140px; }
            .icon-btn::after { display: none !important; } /* No hover tooltips on mobile */
            
            /* Stack split mode vertically on small screens */
            .split-container.split-mode { flex-direction: column; }
            .split-mode .editor-wrapper, .split-mode .preview-wrapper { width: 100% !important; height: 50%; border-right: none; }
            .split-mode .editor-wrapper { border-bottom: 1px solid var(--border-color); }
            
            .cmd-palette { width: 90%; top: 10%; }
            .status-bar .status-left span:nth-child(2), .status-bar .status-left span:nth-child(3) { display: none; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h1>DBP <span>Authenticator</span></h1>
            <input type="password" id="login-pass" class="login-input" placeholder="Enter Master Key">
            <button id="login-btn" class="login-btn">Unlock Workspace</button>
            <div id="login-error">Invalid Credentials. Access Denied.</div>
        </div>
    </div>

    <div id="custom-dialog-overlay" class="dialog-overlay">
        <div class="dialog-box">
            <h3 id="dialog-title">Notice</h3>
            <p id="dialog-message"></p>
            <div class="dialog-actions">
                <button id="dialog-btn-cancel" class="dialog-btn cancel-btn">Cancel</button>
                <button id="dialog-btn-confirm" class="dialog-btn confirm-btn">OK</button>
            </div>
        </div>
    </div>

    <div id="cmd-palette" class="cmd-palette">
        <input type="text" id="cmd-input" class="cmd-input" placeholder="Search or type '>' for commands...">
        <div id="cmd-results" class="cmd-results"></div>
    </div>

    <input type="file" id="file-import" style="display:none" accept="*/*">
    <input type="file" id="file-restore" style="display:none" accept=".dbp,.json">

    <div id="sidebar-container" class="hidden">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="brand"><h1>DBP <span>Notepad</span></h1></div>
                <input type="text" id="search-input" class="search-box" placeholder="Search Database...">
                <div class="sidebar-actions">
                    <button class="sidebar-btn primary" id="btn-new">+ New File</button>
                    <button class="sidebar-btn" id="btn-backup" title="Backup Entire Workspace">📦 Export DB</button>
                    <button class="sidebar-btn" id="btn-restore" title="Restore Workspace">📥 Load DB</button>
                </div>
            </div>
            <div id="notes-list"></div>
        </aside>
        <div class="resizer" id="resizer"></div>
    </div>

    <main id="workspace">
        <div class="tabs">
            <div class="tab active" id="tab-editor">Editor</div>
            <div class="tab" id="tab-preview">Preview</div>
            <button class="toggle-sidebar" id="btn-toggle-sidebar" title="Toggle Sidebar">🗂️</button>
        </div>

        <div class="toolbar">
            <input type="text" id="filename-input" class="filename-input" placeholder="untitled.html">
            <div class="unsaved-dot" id="unsaved-indicator"></div>
            <div class="divider"></div>
            
            <button class="icon-btn primary" id="btn-launch" data-tooltip="Launch in Browser">🚀</button>
            <button class="icon-btn" id="btn-import" data-tooltip="Open Local File">📂</button>
            <button class="icon-btn" id="btn-save" data-tooltip="Sync to Firebase (Ctrl+S)">💾</button>
            <button class="icon-btn" id="btn-export" data-tooltip="Download as Single File">📥</button>
            <button class="icon-btn danger" id="btn-delete" data-tooltip="Permanently Delete File">🗑️</button>
            
            <div class="divider"></div>
            <button class="icon-btn" id="btn-split" data-tooltip="Split Screen Mode">◨</button>
            <button class="icon-btn" id="btn-console" data-tooltip="Toggle Terminal">📟</button>
            <button class="icon-btn" id="btn-wrap" data-tooltip="Toggle Word Wrap">🔄</button>
            <button class="icon-btn" id="btn-palette" data-tooltip="Command Palette (Ctrl+P)">⌨️</button>

            <div class="divider"></div>
            <button class="icon-btn" id="btn-zoom-out" data-tooltip="Decrease Font Size">A-</button>
            <button class="icon-btn" id="btn-zoom-in" data-tooltip="Increase Font Size">A+</button>
        </div>

        <div class="workspace-core">
            <div class="split-container" id="split-container">
                <div class="editor-wrapper" id="editor-wrapper">
                    <div class="line-numbers" id="line-numbers"></div>
                    <textarea id="editor" spellcheck="false" placeholder="Write logic here... Try typing '!html' or 'clg' and press Tab!"></textarea>
                </div>
                <div class="preview-wrapper" id="preview-wrapper">
                    <iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
                    <div id="preview-text"></div>
                </div>
            </div>
            
            <div id="terminal-panel">
                <div class="terminal-header">
                    <span>DBP Console Output</span>
                    <span class="terminal-clear" onclick="document.getElementById('terminal-output').innerHTML=''">🚫 Clear</span>
                </div>
                <div class="terminal-output" id="terminal-output"></div>
            </div>
        </div>

        <footer class="status-bar">
            <div class="status-left">
                <span id="stat-type">TXT</span>
                <span id="stat-size">0 B</span>
                <span id="stat-lines">1 Ln</span>
                <span id="stat-save" style="color: var(--success); display: none;">Saved to Cloud</span>
            </div>
            <div class="status-right">
                <span id="stat-cursor">Ln 1, Col 1</span>
                <span class="dbp-tag">DBP Notepad</span>
            </div>
        </footer>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- AUTHENTICATION LOGIC ---
        const MASTER_PASS = "DBP_236562_DBP_9827700975_DBP";
        const loginOverlay = document.getElementById('login-overlay');
        const loginBtn = document.getElementById('login-btn');
        const loginPass = document.getElementById('login-pass');
        const loginError = document.getElementById('login-error');

        if (localStorage.getItem('dbp_auth') === 'true') {
            loginOverlay.style.display = 'none';
            initFirebaseApp();
        }

        loginBtn.addEventListener('click', () => {
            if (loginPass.value === MASTER_PASS) {
                localStorage.setItem('dbp_auth', 'true');
                loginOverlay.style.display = 'none';
                initFirebaseApp();
            } else {
                loginError.style.display = 'block';
                loginPass.value = '';
            }
        });

        loginPass.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });


        // --- APPLICATION LOGIC ---
        const state = { 
            db: null, currentId: null, notes: [], fontSize: 14, 
            isDirty: false, isWrapped: false, isSplit: false, isTerminalOpen: false 
        };

        const els = {
            editor: document.getElementById('editor'), 
            editorWrapper: document.getElementById('editor-wrapper'),
            lineNumbers: document.getElementById('line-numbers'),
            filenameInput: document.getElementById('filename-input'), 
            unsavedIndicator: document.getElementById('unsaved-indicator'),
            notesList: document.getElementById('notes-list'), 
            splitContainer: document.getElementById('split-container'),
            previewWrapper: document.getElementById('preview-wrapper'), 
            terminal: document.getElementById('terminal-panel'),
            terminalOut: document.getElementById('terminal-output'), 
            cmdPalette: document.getElementById('cmd-palette'),
            cmdInput: document.getElementById('cmd-input'), 
            cmdResults: document.getElementById('cmd-results'),
            fileImport: document.getElementById('file-import')
        };

        const CustomDialog = {
            show: (title, msg, showCancel) => {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('custom-dialog-overlay');
                    document.getElementById('dialog-title').innerText = title;
                    document.getElementById('dialog-message').innerText = msg;
                    const btnCancel = document.getElementById('dialog-btn-cancel');
                    const btnConfirm = document.getElementById('dialog-btn-confirm');
                    
                    btnCancel.style.display = showCancel ? 'inline-block' : 'none';
                    overlay.style.display = 'flex';
                    
                    btnConfirm.onclick = () => { overlay.style.display = 'none'; resolve(true); };
                    btnCancel.onclick = () => { overlay.style.display = 'none'; resolve(false); };
                });
            },
            alert: (msg) => CustomDialog.show("Alert", msg, false),
            confirm: (msg) => CustomDialog.show("Confirm Action", msg, true)
        };

        // --- FIREBASE DATABASE ---
        const DB = {
            init: () => {
                const firebaseConfig = {
                  apiKey: "AIzaSyDpBLVrXegjctcyziEc0viv5bXrPhPAIRM",
                  authDomain: "dbp-notepad.firebaseapp.com",
                  projectId: "dbp-notepad",
                  storageBucket: "dbp-notepad.firebasestorage.app",
                  messagingSenderId: "172820150595",
                  appId: "1:172820150595:web:09d62620c54388376e17f6"
                };
                const app = initializeApp(firebaseConfig);
                state.db = getFirestore(app);
            },
            getAll: async () => {
                try {
                    const snapshot = await getDocs(collection(state.db, "files"));
                    const files = [];
                    snapshot.forEach(doc => files.push(doc.data()));
                    return files.sort((a,b) => b.updatedAt - a.updatedAt);
                } catch(e) {
                    console.error("Firebase Read Error:", e);
                    CustomDialog.alert("Could not fetch files from cloud. Check your connection.");
                    return [];
                }
            },
            save: async (file) => {
                try {
                    await setDoc(doc(state.db, "files", file.id), file);
                    return file;
                } catch (e) {
                    console.error("Firebase Save Error:", e);
                    CustomDialog.alert("Failed to sync file to the cloud.");
                    throw e;
                }
            },
            delete: async (id) => {
                try {
                    await deleteDoc(doc(state.db, "files", id));
                } catch (e) {
                    console.error("Firebase Delete Error:", e);
                    CustomDialog.alert("Failed to delete file from the cloud.");
                }
            }
        };

             async function initFirebaseApp() { 
            DB.init(); 
            
            // 🚨 THE MAGIC SHIELD 🚨
            // This turns on the Sidebar and Toolbar buttons IMMEDIATELY.
            // Even if a text file takes too long to load, your buttons will NEVER freeze!
            setupEvents(); 
            
            // Safely load the database in the background
            try {
                await refreshSidebar(); 
                
                if (state.notes.length > 0) {
                    await openFile(state.notes[0].id); 
                } else {
                    await createNewFile(); 
                }
            } catch (error) {
                console.error("Firebase Load Error:", error);
                await createNewFile(); 
            }
        }


        function setDirty(s) { 
            state.isDirty = s; 
            els.unsavedIndicator.style.display = s ? 'block' : 'none'; 
        }

        function getIconData(fn) {
            if(!fn.includes('.')) return {i:'📄', c:''}; 
            const ext = fn.split('.').pop().toLowerCase();
            const map = { 
                html: {i:'🌐', c:'ext-html'}, htm: {i:'🌐', c:'ext-html'}, 
                css: {i:'🎨', c:'ext-css'}, js: {i:'⚡', c:'ext-js'}, 
                json: {i:'⚙️', c:'ext-json'}, md: {i:'📝', c:'ext-md'}, 
                ino: {i:'🔌', c:'ext-ino'}, py: {i:'🐍', c:'ext-py'} 
            };
            return map[ext] || {i:'📄', c:''};
        }

        async function refreshSidebar(filter = '') {
            state.notes = await DB.getAll(); 
            els.notesList.innerHTML = '';
            
            state.notes.filter(n => n.filename.toLowerCase().includes(filter.toLowerCase())).forEach(f => {
                const icon = getIconData(f.filename); 
                const isHtml = f.filename.toLowerCase().endsWith('.html') || f.filename.toLowerCase().endsWith('.htm');
                const textClass = isHtml ? 'text-html' : '';

                const div = document.createElement('div');
                div.className = `note-card ${f.id === state.currentId ? 'active' : ''}`;
                
                div.innerHTML = `
                    <div class="note-icon ${icon.c}">${icon.i}</div>
                    <div class="note-info">
                        <h3 class="${textClass}">${f.filename}</h3>
                        <p>${new Date(f.updatedAt).toLocaleDateString()}</p>
                    </div>`;
                
                div.onclick = async () => { 
                    if(!state.isDirty || await CustomDialog.confirm("Discard unsaved changes?")) {
                        await openFile(f.id); 
                        if (window.innerWidth <= 768) {
                            document.getElementById('sidebar-container').classList.add('hidden');
                        }
                    }
                }; 
                
                els.notesList.appendChild(div);
            });
        }

        function autoDetectExtension(content) {
            const text = content.trim();
            if (!text) return '.txt';
            if (/<!DOCTYPE html>|<html/i.test(text) || /<body|<head|<div|<script/i.test(text)) return '.html';
            if (text.startsWith('{') || text.startsWith('[')) { try { JSON.parse(text); return '.json'; } catch (e) {} }
            if (/#include\s*<|void\s+setup\s*\(\)|void\s+loop\s*\(\)/.test(text)) return '.ino';
            if (/^[.#a-zA-Z0-9\s,-]+\s*\{[^}]+\}/m.test(text) && /:[^;]+;/.test(text)) return '.css';
            if (/function\s+\w+\(|const\s+\w+\s*=|let\s+\w+\s*=|console\.log\(|=>/.test(text)) return '.js';
            if (/def\s+\w+\(|import\s+[a-z]|print\(|if\s+__name__\s*==\s*['"]__main__['"]/.test(text)) return '.py';
            return '.txt';
        }

        async function saveFile() {
            let fn = els.filenameInput.value.trim(); 
            if (!fn) fn = 'untitled'; 
            if (!fn.includes('.')) fn += autoDetectExtension(els.editor.value);
            
            els.filenameInput.value = fn;
            
            const file = { 
                id: state.currentId || Date.now().toString(), 
                filename: fn, content: els.editor.value, updatedAt: Date.now() 
            };
            
            try {
                await DB.save(file); 
                state.currentId = file.id; 
                setDirty(false); 
                
                const statSave = document.getElementById('stat-save');
                statSave.style.display = 'inline'; 
                setTimeout(() => statSave.style.display = 'none', 3000);
                
                await refreshSidebar(document.getElementById('search-input').value); 
                updatePreview();
            } catch(err) {
                // Handled in DB.save
            }
        }

        async function openFile(id) { 
            const file = state.notes.find(n => n.id === id); 
            if (!file) return; 
            
            state.currentId = file.id; 
            els.editor.value = file.content; 
            els.filenameInput.value = file.filename; 
            
            setDirty(false); 
            updateMetrics(); 
            updatePreview(); 
            
            await refreshSidebar(document.getElementById('search-input').value);
        }

        async function createNewFile() { 
            if(state.isDirty && !(await CustomDialog.confirm("Discard unsaved changes?"))) return; 
            
            state.currentId = null; 
            els.editor.value = '';
            els.filenameInput.value = ''; 
            
            setDirty(false); 
            updateMetrics(); 
            els.editor.focus(); 
            updatePreview(); 
            
            await refreshSidebar(document.getElementById('search-input').value);
        }

        function updateMetrics() {
            const lines = els.editor.value.split('\n'); 
            const pos = els.editor.selectionStart; 
            const cursorLines = els.editor.value.substring(0, pos).split('\n'); 
            const row = cursorLines.length;
            
            els.lineNumbers.innerHTML = lines.map((_, i) => `<span class="${i + 1 === row ? 'active-line' : ''}">${i + 1}</span>`).join(''); 
            els.lineNumbers.scrollTop = els.editor.scrollTop;
            
            const ext = (els.filenameInput.value || 'TXT').split('.').pop().toUpperCase();
            document.getElementById('stat-type').innerText = ext;
            document.getElementById('stat-lines').innerText = `${lines.length} Ln`; 
            document.getElementById('stat-size').innerText = `${new Blob([els.editor.value]).size} B`;
            document.getElementById('stat-cursor').innerText = `Ln ${row}, Col ${cursorLines[row - 1].length + 1}`;
        }

        function insertText(text, offset = 0) {
            const s = els.editor.selectionStart;
            const e = els.editor.selectionEnd; 
            els.editor.value = els.editor.value.substring(0, s) + text + els.editor.value.substring(e);
            els.editor.selectionStart = els.editor.selectionEnd = s + text.length + offset; 
            setDirty(true); 
            updateMetrics();
        }

        els.editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const textBeforeCursor = this.value.substring(0, this.selectionStart);
                const match = textBeforeCursor.match(/([^\s]+)$/);
                if (match) {
                    const word = match[1];
                    const snippets = {
                        '!html': `<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <title>DBP App</title>\n</head>\n<body>\n    \n</body>\n</html>`,
                        'clg': `console.log();`,
                        'for': `for (let i = 0; i < array.length; i++) {\n    \n}`
                    };
                    if (snippets[word]) {
                        this.value = this.value.substring(0, this.selectionStart - word.length) + snippets[word] + this.value.substring(this.selectionEnd);
                        this.selectionStart = this.selectionEnd = this.selectionStart - word.length + snippets[word].length - (word==='clg'?2:0);
                        setDirty(true); updateMetrics(); return;
                    }
                }
                insertText("    ");
            } else if (e.key === 'Enter') {
                e.preventDefault(); 
                const currentLine = this.value.substring(0, this.selectionStart).split('\n').pop();
                const leadingSpaces = currentLine.match(/^\s*/)[0]; 
                insertText('\n' + leadingSpaces);
            } else {
                const pairs = { '{': '}', '[': ']', '(': ')', '"': '"', "'": "'" };
                if (pairs[e.key]) { e.preventDefault(); insertText(e.key + pairs[e.key], -1); }
            }
        });

        // --- PREVIEW FIXES ---
        const consoleInject = `<script>
            const _log = console.log, _err = console.error, _warn = console.warn;
            console.log = (...a) => { window.parent.postMessage({type:'log', msg:a.join(' ')}, '*'); _log(...a); };
            console.error = (...a) => { window.parent.postMessage({type:'error', msg:a.join(' ')}, '*'); _err(...a); };
            console.warn = (...a) => { window.parent.postMessage({type:'warn', msg:a.join(' ')}, '*'); _warn(...a); };
            window.onerror = (m,s,l,c,e) => { window.parent.postMessage({type:'error', msg: m + ' at line ' + l}, '*'); };
        <\/script>`;

        window.addEventListener('message', (e) => {
            if(e.data && e.data.type) {
                const div = document.createElement('div'); 
                div.className = `log-line log-${e.data.type}`;
                div.innerText = `[${new Date().toLocaleTimeString()}] ${e.data.msg}`;
                els.terminalOut.appendChild(div); els.terminalOut.scrollTop = els.terminalOut.scrollHeight;
                if(!state.isTerminalOpen) document.getElementById('btn-console').click(); 
            }
        });

        function updatePreview() {
            const ext = els.filenameInput.value.toLowerCase().split('.').pop(); 
            const pf = document.getElementById('preview-frame');
            const pt = document.getElementById('preview-text');
            
            if (['html', 'htm'].includes(ext)) { 
                pf.style.display = 'block'; pt.style.display = 'none'; 
                pf.srcdoc = consoleInject + els.editor.value; 
            } else {
                pf.style.display = 'none'; pt.style.display = 'block';
                if(ext === 'json') { 
                    try { pt.innerHTML = `<pre style="color:var(--success);">${JSON.stringify(JSON.parse(els.editor.value), null, 4)}</pre>`; } 
                    catch(e) { pt.innerHTML = `<div style="color:var(--danger)">Error: ${e.message}</div>`; } 
                } else {
                    pt.innerHTML = els.editor.value.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
                }
            }
        }

        // --- EXPORT, IMPORT & DELETE ---
        document.getElementById('btn-import').onclick = async () => {
            if(state.isDirty && !(await CustomDialog.confirm("You have unsaved changes. Discard them to open a new file?"))) return;
            els.fileImport.click();
        };

        els.fileImport.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const newFile = { id: Date.now().toString(), filename: file.name, content: ev.target.result, updatedAt: Date.now() };
                await DB.save(newFile);
                await openFile(newFile.id);
                CustomDialog.alert(`File "${file.name}" opened successfully!`);
            };
            reader.readAsText(file);
            e.target.value = '';
        };

        document.getElementById('btn-export').onclick = () => {
            const filename = els.filenameInput.value || 'export.txt';
            const ext = filename.split('.').pop().toLowerCase();
            let mimeType = 'text/plain';
            if (ext === 'html' || ext === 'htm') mimeType = 'text/html';
            else if (ext === 'js') mimeType = 'application/javascript';
            else if (ext === 'css') mimeType = 'text/css';
            else if (ext === 'json') mimeType = 'application/json';

            const blob = new Blob([els.editor.value], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        };
        
        document.getElementById('btn-backup').onclick = async () => {
            const all = await DB.getAll(); 
            const blob = new Blob([JSON.stringify(all)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `DBP_Firebase_Backup_${new Date().getTime()}.dbp`; a.click();
        };

        document.getElementById('btn-restore').onclick = () => document.getElementById('file-restore').click();

        document.getElementById('file-restore').onchange = (e) => {
            const file = e.target.files[0]; if(!file) return; 
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result); 
                    if(!(await CustomDialog.confirm("This will merge with your current Firebase files. Proceed?"))) return;
                    for(let f of data) await DB.save(f); 
                    await refreshSidebar(); 
                    CustomDialog.alert("Workspace Restored to Cloud!");
                } catch(err) { CustomDialog.alert("Invalid .dbp backup file."); }
            }; reader.readAsText(file);
        };

        document.getElementById('btn-delete').onclick = async () => { 
            if(!state.currentId) return CustomDialog.alert("No saved file is currently selected.");
            if(await CustomDialog.confirm(`Permanently delete "${els.filenameInput.value}" from the cloud?`)) { 
                await DB.delete(state.currentId); 
                await CustomDialog.alert(`File deleted.`);
                await createNewFile(); 
            }
        };

        // --- TAB & UI TOGGLES ---
        document.getElementById('tab-editor').onclick = () => { 
            document.getElementById('tab-editor').classList.add('active'); 
            document.getElementById('tab-preview').classList.remove('active'); 
            els.splitContainer.classList.remove('split-mode'); 
            state.isSplit = false;
            document.getElementById('btn-split').classList.remove('active');
            
            els.editorWrapper.style.display = 'flex'; 
            els.editorWrapper.style.width = '100%';
            els.previewWrapper.style.display = 'none'; 
        };

        document.getElementById('tab-preview').onclick = () => { 
            document.getElementById('tab-preview').classList.add('active'); 
            document.getElementById('tab-editor').classList.remove('active'); 
            els.splitContainer.classList.remove('split-mode'); 
            state.isSplit = false;
            document.getElementById('btn-split').classList.remove('active');
            
            els.editorWrapper.style.display = 'none'; 
            els.previewWrapper.style.display = 'flex'; 
            els.previewWrapper.style.width = '100%';
            updatePreview(); 
        };

        document.getElementById('btn-split').onclick = () => { 
            state.isSplit = !state.isSplit; 
            document.getElementById('btn-split').classList.toggle('active', state.isSplit); 
            
            if (state.isSplit) {
                document.getElementById('tab-editor').classList.add('active'); 
                document.getElementById('tab-preview').classList.add('active'); 
                els.splitContainer.classList.add('split-mode'); 
                els.editorWrapper.style.display = 'flex';
                // Handled in CSS media queries for mobile vs desktop
                if (window.innerWidth > 768) {
                    els.editorWrapper.style.width = '50%';
                    els.previewWrapper.style.width = '50%';
                }
                els.previewWrapper.style.display = 'flex';
                updatePreview(); 
            } else {
                document.getElementById('tab-editor').click();
            }
        };

        document.getElementById('btn-console').onclick = () => { 
            state.isTerminalOpen = !state.isTerminalOpen; 
            els.terminal.style.display = state.isTerminalOpen ? 'flex' : 'none'; 
            document.getElementById('btn-console').classList.toggle('active', state.isTerminalOpen); 
        };

        function applyFontSize() { document.documentElement.style.setProperty('--editor-font-size', `${state.fontSize}px`); }
        document.getElementById('btn-zoom-in').onclick = () => { if (state.fontSize < 40) { state.fontSize += 2; applyFontSize(); }};
        document.getElementById('btn-zoom-out').onclick = () => { if (state.fontSize > 8) { state.fontSize -= 2; applyFontSize(); }};
        
        function togglePalette() { els.cmdPalette.style.display = els.cmdPalette.style.display === 'flex' ? 'none' : 'flex'; if(els.cmdPalette.style.display==='flex') { els.cmdInput.value = ''; els.cmdInput.focus(); updatePalette(); } else els.editor.focus(); }
        function updatePalette() {
            const q = els.cmdInput.value.toLowerCase(); els.cmdResults.innerHTML = '';
            if (q.startsWith('>')) { 
                const cmds = [ { n: 'Split Screen', a: () => document.getElementById('btn-split').click() }, { n: 'Toggle Terminal', a: () => document.getElementById('btn-console').click() }, { n: 'Export Workspace', a: () => document.getElementById('btn-backup').click() } ];
                cmds.filter(c => c.n.toLowerCase().includes(q.substring(1).trim())).forEach(c => { const d = document.createElement('div'); d.className = 'cmd-item'; d.innerHTML = `<span>⚙️ ${c.n}</span>`; d.onclick = () => { c.a(); togglePalette(); }; els.cmdResults.appendChild(d); });
            } else { 
                state.notes.filter(n => n.filename.toLowerCase().includes(q)).forEach(f => { const d = document.createElement('div'); d.className = 'cmd-item'; d.innerHTML = `<span>📄 ${f.filename}</span>`; d.onclick = async () => { if(!state.isDirty || await CustomDialog.confirm("Discard?")) openFile(f.id); togglePalette(); }; els.cmdResults.appendChild(d); });
            }
        }
        els.cmdInput.addEventListener('input', updatePalette);

        function setupEvents() {
            els.editor.addEventListener('input', () => { setDirty(true); updateMetrics(); });
            els.editor.addEventListener('scroll', () => els.lineNumbers.scrollTop = els.editor.scrollTop);
            els.editor.addEventListener('keyup', updateMetrics); els.editor.addEventListener('click', updateMetrics);
            els.filenameInput.addEventListener('input', () => setDirty(true));
            document.getElementById('btn-new').onclick = createNewFile; document.getElementById('btn-save').onclick = saveFile;
            document.getElementById('btn-wrap').onclick = () => { state.isWrapped = !state.isWrapped; els.editor.style.whiteSpace = state.isWrapped ? 'pre-wrap' : 'pre'; document.getElementById('btn-wrap').classList.toggle('active'); };
            document.getElementById('btn-toggle-sidebar').onclick = () => document.getElementById('sidebar-container').classList.toggle('hidden');
            document.getElementById('btn-palette').onclick = togglePalette;
            document.getElementById('btn-launch').onclick = () => { const mimeType = els.filenameInput.value.endsWith('html') ? 'text/html' : 'text/plain'; window.open(URL.createObjectURL(new Blob([els.editor.value], { type: mimeType })), '_blank'); };
            document.getElementById('search-input').addEventListener('input', (e) => refreshSidebar(e.target.value));
            
            let isResizing = false; document.getElementById('resizer').onmousedown = () => isResizing = true;
            document.onmousemove = (e) => { if(isResizing && e.clientX > 200 && e.clientX < 500 && window.innerWidth > 768) document.documentElement.style.setProperty('--sidebar-width', `${e.clientX}px`); };
            document.onmouseup = () => isResizing = false;
            
            document.addEventListener('keydown', (e) => { 
                if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); } 
                if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault(); togglePalette(); } 
                if (e.key === 'Escape') { 
                    if(document.getElementById('custom-dialog-overlay').style.display === 'flex') document.getElementById('dialog-btn-cancel').click(); 
                    else if (els.cmdPalette.style.display === 'flex') togglePalette(); 
                }
            });
            window.onbeforeunload = () => state.isDirty ? "Unsaved changes!" : null;
        }

    </script>
